name: Apply SPE-2772 shipped handoff

on:
  push:
    branches:
      - jamesdyedbq/spe-2772-canonical-live-facility-workshop-safety-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jamesdyedbq/spe-2772-canonical-live-facility-workshop-safety-integration
          fetch-depth: 0
      - run: python .github/scripts/apply-spe-2772-shipped-handoff.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-spe-2772-shipped-handoff.yml
          git rm .github/scripts/apply-spe-2772-shipped-handoff.py
          git add planning/backlog.md planning/backlog-handoff-manifest.json
          git commit -m "docs(workshops): mark SPE-2772 shipped in handoff"
          git push origin HEAD:jamesdyedbq/spe-2772-canonical-live-facility-workshop-safety-integration

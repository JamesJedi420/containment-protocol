name: Fix stale-description grammar

on:
  push:
    branches:
      - maintenance/stale-description-cleanup-2026-08-05
    paths:
      - .github/scripts/fix_stale_description_grammar.py
      - .github/workflows/fix-stale-description-grammar.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/stale-description-cleanup-2026-08-05
      - name: Apply grammar correction
        run: python .github/scripts/fix_stale_description_grammar.py
      - name: Remove temporary helper
        run: |
          rm .github/scripts/fix_stale_description_grammar.py
          rm .github/workflows/fix-stale-description-grammar.yml
      - name: Commit correction
        run: |
          git config user.name "James Jedi"
          git config user.email "95941127+JamesJedi420@users.noreply.github.com"
          git add planning .github/scripts .github/workflows
          if git diff --cached --quiet; then
            echo "No grammar corrections required"
            exit 0
          fi
          git commit -m "docs: repair stale-description grammar"
          git push

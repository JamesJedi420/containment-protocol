name: Harvest purpose fix

on:
  push:
    branches:
      - chore/governance-approval-gate-alignment

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/governance-approval-gate-alignment
          fetch-depth: 0

      - name: Align harvest index purpose with pending apply
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('planning/harvest-reconciliation-index.md')
          text = p.read_text()
          old = '**Purpose:** Track pattern-harvest batches reconciled to Linear. These docs are **non-authoritative** for implementation sequencing (see `planning/backlog.md`). They mirror closure already posted on Linear.'
          new = '**Purpose:** Track historical pattern-harvest batches reconciled to Linear and forward batches whose canonical candidate-ledger state is `applied` or `pending apply`. These docs are **non-authoritative** for implementation sequencing (see `planning/backlog.md`). Historical rows mirror closure already posted on Linear; forward `pending apply` rows explicitly do not claim canonical closure.'
          if old not in text:
              raise SystemExit('purpose marker not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Commit intended docs change and remove this helper
        shell: bash
        run: |
          rm .github/workflows/harvest-purpose-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add planning/harvest-reconciliation-index.md .github/workflows/harvest-purpose-fix.yml
          git diff --cached --check
          git commit -m 'fix: align harvest index purpose with pending apply'
          git push origin HEAD:chore/governance-approval-gate-alignment

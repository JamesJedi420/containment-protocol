name: Refine SPE-2772 persistence baselines

on:
  push:
    branches:
      - jamesdyedbq/spe-2772-canonical-live-facility-workshop-safety-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jamesdyedbq/spe-2772-canonical-live-facility-workshop-safety-integration
          fetch-depth: 0
      - run: python .github/scripts/refine-spe-2772-persistence-baselines.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/refine-spe-2772-persistence-baselines.yml
          git rm .github/scripts/refine-spe-2772-persistence-baselines.py
          git add src/test/departmentWorkshopPersistence.test.ts
          git commit -m "test(workshops): share active facility across persistence controls"
          git push origin HEAD:jamesdyedbq/spe-2772-canonical-live-facility-workshop-safety-integration

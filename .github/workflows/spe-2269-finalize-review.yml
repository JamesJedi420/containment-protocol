name: SPE-2269 finalize review

on:
  push:
    branches:
      - agent/spe-2269-deployable-readiness-composition
    paths:
      - .github/workflows/spe-2269-finalize-review.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/spe-2269-deployable-readiness-composition
      - name: Apply bounded review corrections
        run: python3 scripts/spe-2269-finalize-review.py
      - name: Commit corrected branch
        run: |
          rm .github/workflows/spe-2269-finalize-review.yml
          rm scripts/spe-2269-finalize-review.py
          git config user.name "James Jedi"
          git config user.email "95941127+JamesJedi420@users.noreply.github.com"
          git add src/domain/deployableReadiness.ts src/test/deployableReadiness.test.ts planning/backlog.md planning/backlog-handoff-manifest.json planning/spe-2269-deployable-readiness-composition-slice.md .github/workflows/spe-2269-finalize-review.yml scripts/spe-2269-finalize-review.py
          git commit -m "SPE-2269: address review and finalize handoff"
          git push

name: Apply SPE-2772 orchestration edit

on:
  push:
    branches:
      - jamesdyedbq/spe-2772-canonical-live-facility-workshop-safety-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jamesdyedbq/spe-2772-canonical-live-facility-workshop-safety-integration
          fetch-depth: 0
      - name: Apply exact import edit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/domain/sim/advanceWeek.ts')
          text = path.read_text()
          old = """  reconcileDepartmentWorkshopTerminalLanes,\n  registerDepartmentWorkshopCompletionOutcomes,\n  sanitizeDepartmentWorkshopCompletionOutcomes,\n} from '../departmentWorkshopQueue'\n"""
          new = """  reconcileDepartmentWorkshopTerminalLanes,\n  sanitizeDepartmentWorkshopCompletionOutcomes,\n} from '../departmentWorkshopQueue'\nimport { registerDepartmentWorkshopCompletionOutcomes } from '../departmentWorkshopLiveFacilitySafety'\n"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one workshop import block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit bounded edit and remove helper workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/spe-2772-apply.yml
          git add src/domain/sim/advanceWeek.ts
          git commit -m "feat(workshops): wire live facility safety at week close"
          git push origin HEAD:jamesdyedbq/spe-2772-canonical-live-facility-workshop-safety-integration

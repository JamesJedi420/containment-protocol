name: Apply SPE-2772 facility id doc

on:
  push:
    branches:
      - jamesdyedbq/spe-2772-canonical-live-facility-workshop-safety-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jamesdyedbq/spe-2772-canonical-live-facility-workshop-safety-integration
          fetch-depth: 0
      - run: python .github/scripts/apply-spe-2772-facility-id-doc.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/spe-2772-facility-id-doc.yml
          git rm .github/scripts/apply-spe-2772-facility-id-doc.py
          git add docs/department-workshop-queue-audit.md
          git commit -m "docs(workshops): use authored production facility id"
          git push origin HEAD:jamesdyedbq/spe-2772-canonical-live-facility-workshop-safety-integration

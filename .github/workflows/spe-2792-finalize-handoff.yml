name: SPE-2792 finalize handoff records

on:
  push:
    branches:
      - agent/spe-2792-live-facility-room-quality

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/spe-2792-live-facility-room-quality
      - name: Finalize canonical handoff records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('planning/backlog-handoff-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['primary'] = None
          manifest['inProgress'] = []
          manifest['recentlyShipped'] = [
              'SPE-2792',
              'SPE-2772',
              'SPE-2788',
              'SPE-2787',
              'SPE-2786',
              'SPE-2785',
              'SPE-2784',
              'SPE-2783',
              'SPE-2782',
              'SPE-2781',
              'SPE-2780',
              'SPE-2779',
          ]
          slice_key = 'planning/spe-2792-workshop-live-room-quality-slice.md'
          if manifest.get('sliceDocStatus', {}).get(slice_key) != 'In progress':
              raise SystemExit('manifest SPE-2792 status is not In progress')
          manifest['sliceDocStatus'][slice_key] = 'Shipped'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          slice_path = Path(slice_key)
          slice_text = slice_path.read_text()
          old_status = '| **Status** | **In progress** |'
          new_status = '| **Status** | **Shipped** |'
          if slice_text.count(old_status) != 1:
              raise SystemExit(f'expected one slice status row, found {slice_text.count(old_status)}')
          old_validation = 'Linear tracks the pull request in review while the repository handoff classification remains In progress until shipment. The manifest, `planning/backlog.md`, planning slice index, and workshop audit identify SPE-2792 as the active bounded slice. Full test validation remains pending on the corrected branch head.'
          new_validation = 'Implementation head `11fc264a7a47e8b70971aaf144dcaa62977f52b9` passed Test workflow run 2294: lint, design-audit verification, backlog-handoff verification, external-theme-contract verification, and the full non-watch test suite. The repository handoff records are now merge-ready and mark this bounded slice Shipped; Linear remains In Review until PR #3468 merges.'
          if slice_text.count(old_validation) != 1:
              raise SystemExit(f'expected one validation paragraph, found {slice_text.count(old_validation)}')
          slice_path.write_text(slice_text.replace(old_status, new_status).replace(old_validation, new_validation))

          backlog_path = Path('planning/backlog.md')
          lines = backlog_path.read_text().splitlines()
          old_primary = '**Current handoff (primary):** [SPE-2792](https://linear.app/spectranoir/issue/SPE-2792/canonical-live-facility-workshop-room-condition-quality-integration) — integrate authoritative `facility:biohazard-response-lab` state into the existing `roomContamination` completion-quality axis through PR #3468. Parent [SPE-1028](https://linear.app/spectranoir/issue/SPE-1028/department-workshop-and-processing-queue-model) remains In Progress and open for broader live inputs, clutter/disorder consequences, and lifecycle work.'
          new_primary = '**Current handoff (primary):** (none) — SPE-2792 is merge-ready and recorded as shipped; select the next evidence-backed bounded child after PR #3468 merges. Parent [SPE-1028](https://linear.app/spectranoir/issue/SPE-1028/department-workshop-and-processing-queue-model) remains open for broader live inputs, clutter/disorder consequences, and lifecycle work.'
          old_progress = '**In progress:** [SPE-2792](https://linear.app/spectranoir/issue/SPE-2792/canonical-live-facility-workshop-room-condition-quality-integration) — bounded live room-quality integration is in review through PR #3468.'
          new_progress = '**In progress:** (none)'

          def replace_exact_line(old, new):
              matches = [i for i, line in enumerate(lines) if line == old]
              if len(matches) != 1:
                  raise SystemExit(f'expected one exact line, found {len(matches)}: {old[:80]}')
              lines[matches[0]] = new

          replace_exact_line(old_primary, new_primary)
          replace_exact_line(old_progress, new_progress)

          shipped_line = '**Recently shipped:** [SPE-2792](https://linear.app/spectranoir/issue/SPE-2792/canonical-live-facility-workshop-room-condition-quality-integration) — authored live `facility:biohazard-response-lab` state now composes only the existing `roomContamination` quality axis into exact completed biohazard-response work orders through the sole canonical completion registrar; active remains nominal, absent or non-active becomes `poor_room_contamination`, caller-owned sibling axes remain intact, and stored receipts remain replay-stable; PR #3468; parent SPE-1028 remains open.'
          if not any(line == shipped_line for line in lines):
              anchor_matches = [i for i, line in enumerate(lines) if line.startswith('**Recently shipped:** [SPE-2772]')]
              if len(anchor_matches) != 1:
                  raise SystemExit(f'expected one SPE-2772 shipped anchor, found {len(anchor_matches)}')
              lines.insert(anchor_matches[0], shipped_line)
              lines.insert(anchor_matches[0] + 1, '')

          filename = 'spe-2792-workshop-live-room-quality-slice.md'
          row_matches = [i for i, line in enumerate(lines) if filename in line and line.startswith('| `')]
          if len(row_matches) != 1:
              raise SystemExit(f'expected one SPE-2792 table row, found {len(row_matches)}')
          if '**In progress**' not in lines[row_matches[0]]:
              raise SystemExit('SPE-2792 table row is not In progress')
          lines[row_matches[0]] = lines[row_matches[0]].replace('**In progress**', '**Shipped**', 1)
          backlog_path.write_text('\n'.join(lines) + '\n')

          Path('.github/workflows/spe-2792-finalize-handoff.yml').unlink()
          PY
      - name: Commit merge-ready records
        run: |
          git config user.name 'James Jedi'
          git config user.email '95941127+JamesJedi420@users.noreply.github.com'
          git add planning/backlog-handoff-manifest.json planning/backlog.md planning/spe-2792-workshop-live-room-quality-slice.md .github/workflows/spe-2792-finalize-handoff.yml
          git commit -m 'SPE-2792: finalize merge-ready handoff records'
          git push origin HEAD:agent/spe-2792-live-facility-room-quality

name: SPE-2792 index slice record

on:
  push:
    branches:
      - agent/spe-2792-live-facility-room-quality

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/spe-2792-live-facility-room-quality
      - name: Add planning index row
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('planning/backlog.md')
          lines = path.read_text().splitlines()
          filename = 'spe-2792-workshop-live-room-quality-slice.md'
          if any(filename in line for line in lines):
              raise SystemExit('SPE-2792 slice row already exists')

          anchor = 'spe-2788-department-workshop-activation-slice.md'
          matches = [index for index, line in enumerate(lines) if anchor in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one SPE-2788 index row, found {len(matches)}')

          row = '| `spe-2792-workshop-live-room-quality-slice.md`                         | **In progress** | [SPE-2792](https://linear.app/spectranoir/issue/SPE-2792/canonical-live-facility-workshop-room-condition-quality-integration) / [#3464](https://github.com/JamesJedi420/containment-protocol/issues/3464) / PR #3468 — authored live facility state projects only the existing room-contamination quality axis through the canonical completion registrar; parent SPE-1028 remains open. |'
          lines.insert(matches[0] + 1, row)
          path.write_text('\n'.join(lines) + '\n')
          Path('.github/workflows/spe-2792-index-slice.yml').unlink()
          PY
      - name: Commit planning index row
        run: |
          git config user.name 'James Jedi'
          git config user.email '95941127+JamesJedi420@users.noreply.github.com'
          git add planning/backlog.md .github/workflows/spe-2792-index-slice.yml
          git commit -m 'SPE-2792: index bounded slice record'
          git push origin HEAD:agent/spe-2792-live-facility-room-quality

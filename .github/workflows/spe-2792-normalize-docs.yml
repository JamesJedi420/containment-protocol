name: SPE-2792 normalize handoff docs

on:
  push:
    branches:
      - agent/spe-2792-live-facility-room-quality

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/spe-2792-live-facility-room-quality
      - name: Normalize canonical records
        run: |
          python - <<'PY'
          from pathlib import Path

          backlog = Path('planning/backlog.md')
          text = backlog.read_text()
          old_primary = '''**Current handoff (primary):** (none) — SPE-2772 is shipped; select the next evidence-backed unblocked child. Parent [SPE-1028](https://linear.app/spectranoir/issue/SPE-1028/department-workshop-and-processing-queue-model) remains open.'''
          new_primary = '''**Current handoff (primary):** [SPE-2792](https://linear.app/spectranoir/issue/SPE-2792/canonical-live-facility-workshop-room-condition-quality-integration) — integrate authoritative `facility:biohazard-response-lab` state into the existing `roomContamination` completion-quality axis through PR #3468. Parent [SPE-1028](https://linear.app/spectranoir/issue/SPE-1028/department-workshop-and-processing-queue-model) remains In Progress and open for broader live inputs, clutter/disorder consequences, and lifecycle work.'''
          old_progress = '**In progress:** (none)'
          new_progress = '**In progress:** [SPE-2792](https://linear.app/spectranoir/issue/SPE-2792/canonical-live-facility-workshop-room-condition-quality-integration) — bounded live room-quality integration is in review through PR #3468.'
          if text.count(old_primary) != 1:
              raise SystemExit(f'expected one primary handoff match, found {text.count(old_primary)}')
          if text.count(old_progress) != 1:
              raise SystemExit(f'expected one in-progress match, found {text.count(old_progress)}')
          backlog.write_text(text.replace(old_primary, new_primary).replace(old_progress, new_progress))

          audit = Path('docs/department-workshop-queue-audit.md')
          audit_text = audit.read_text()
          owner_row = '| Live facility safety projection               | `departmentWorkshopFacilityMapping.ts` + `departmentWorkshopLiveFacilitySafety.ts` (SPE-2772) |'
          quality_row = '| Live facility room-quality projection         | `departmentWorkshopFacilityQualityMapping.ts` + `departmentWorkshopLiveFacilitySafety.ts` (SPE-2792) |'
          if audit_text.count(owner_row) != 1:
              raise SystemExit(f'expected one live-safety owner row, found {audit_text.count(owner_row)}')
          if quality_row not in audit_text:
              audit_text = audit_text.replace(owner_row, owner_row + '\n' + quality_row)

          section = (
              '\n\n## SPE-2792 live facility room-quality integration\n\n'
              'SPE-2792 adds one authored completion-quality projection without changing the\n'
              'canonical workshop processing or receipt-registration order.\n'
              '`department:biohazard-response` reuses the stable\n'
              '`facility:biohazard-response-lab` facility and maps current `facilityState` only\n'
              'to the existing `roomContamination` quality axis. An active facility resolves\n'
              '`good`; an absent or non-active facility resolves `poor`. Unmapped departments\n'
              "retain caller-owned quality conditions or the registrar's neutral nominal\n"
              'baseline.\n\n'
              'The exact-work-order projector deduplicates completed IDs, sorts them by code\n'
              'unit, ignores unknown work orders, and composes only the room axis. Existing\n'
              'caller-owned input, specialist, dependency, equipment, and reagent axes remain\n'
              'unchanged, including their established reason precedence. When a mapped work\n'
              'order has no caller-owned quality conditions, neutral-good required axes are\n'
              'supplied so the authoritative room condition can be graded by\n'
              '`resolveDepartmentWorkshopCompletionQuality`.\n\n'
              'The existing live-facility registration wrapper contributes both transient\n'
              'quality and safety maps to the sole completion-outcome registrar at the same\n'
              'canonical `advanceWeek` hook. No second hook, grader, persisted quality-input\n'
              'map, schema field, or hydration key is introduced. Existing receipts retain\n'
              'precedence across replay and save/load, so later facility recovery cannot\n'
              'regrade historical output. This slice does not project staff, equipment,\n'
              'reagents, dependencies, staging, operating mode, upgrades, clutter, disorder,\n'
              'or broader lifecycle consequences.\n'
          )
          if '## SPE-2792 live facility room-quality integration' not in audit_text:
              audit_text = audit_text.rstrip() + section + '\n'
          audit.write_text(audit_text)

          Path('.github/workflows/spe-2792-normalize-docs.yml').unlink()
          PY
      - name: Commit normalized records
        run: |
          git config user.name 'James Jedi'
          git config user.email '95941127+JamesJedi420@users.noreply.github.com'
          git add planning/backlog.md docs/department-workshop-queue-audit.md .github/workflows/spe-2792-normalize-docs.yml
          git commit -m 'SPE-2792: normalize canonical handoff records'
          git push origin HEAD:agent/spe-2792-live-facility-room-quality

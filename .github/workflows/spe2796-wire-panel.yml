name: SPE-2796 wire explanation panel

on:
  push:
    branches:
      - agent/spe-2796-operational-explanations
    paths:
      - .github/workflows/spe2796-wire-panel.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spe-2796-operational-explanations
      - name: Apply exact page edits
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/operations/DepartmentWorkshopMirrorPage.tsx')
          text = path.read_text()
          old_import = "import { getDepartmentWorkshopMirrorView } from './departmentWorkshopMirrorView'\n"
          new_import = old_import + "import { DepartmentWorkshopExplanationPanel } from './DepartmentWorkshopExplanationPanel'\n"
          if old_import not in text:
              raise SystemExit('import anchor missing')
          text = text.replace(old_import, new_import, 1)
          anchor = '''      <article
        className="panel panel-support space-y-4"
        role="region"
        aria-label="Completion quality and safety ledger"
      >'''
          insertion = '''      <DepartmentWorkshopExplanationPanel explanations={view.explanations} />

''' + anchor
          if anchor not in text:
              raise SystemExit('panel anchor missing')
          text = text.replace(anchor, insertion, 1)
          path.write_text(text)
          PY
          git config user.name "JamesJedi420"
          git config user.email "95941127+JamesJedi420@users.noreply.github.com"
          git add src/features/operations/DepartmentWorkshopMirrorPage.tsx
          git rm .github/workflows/spe2796-wire-panel.yml
          git commit -m "SPE-2796: render workshop operational explanations"
          git push origin HEAD:agent/spe-2796-operational-explanations

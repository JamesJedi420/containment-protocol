name: Test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
      STRICT_TEST_CONSOLE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify design audits index
        run: npm run verify:audits-index

      - name: Verify backlog handoff
        run: npm run verify:backlog-handoff

      - name: Verify external theme contracts
        run: npm run verify:theme-contracts

      - name: Verify canonical governance contract
        run: npm run verify:governance-contract

      - name: Run tests (non-watch)
        run: npm run test:run:ci

      # Coverage re-runs the full suite under instrumentation (~as long as the test
      # step). Keep it on main pushes only so PR babysit stays one suite deep.
      - name: Coverage
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: npm run coverage:ci

  # SPE-3458 — advisory Chromium E2E. Visible pass/fail + artifacts.
  # Not a required merge gate (SPE-3348 owns required-validator policy).
  # Does not replace or duplicate the Vitest job above.
  playwright-e2e:
    name: playwright-e2e (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E (advisory)
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

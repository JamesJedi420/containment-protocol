name: Test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
      STRICT_TEST_CONSOLE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SPE-3348 — same requirement resolver as local pre-ship.
      # Playwright stays in its own job (browser install). Exclude it here.
      - name: Resolve and run required validators
        env:
          # Prefer PR base SHA; on push skip all-zero "before" (new branch) and use HEAD~1 via runner default.
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$VALIDATION_BASE" ] && [ "$VALIDATION_BASE" != "0000000000000000000000000000000000000000" ]; then
            export VALIDATION_BASE
          else
            unset VALIDATION_BASE
          fi
          npm run verify:requirements -- --ci --exclude=playwright-e2e

      # Coverage re-runs the full suite under instrumentation (~as long as the test
      # step). Keep it on main pushes only so PR babysit stays one suite deep.
      - name: Coverage
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: npm run coverage:ci

  # SPE-3348 — Playwright selection from the shared requirement model.
  # Required when e2e harness paths change; advisory for player-path UI changes.
  # Not an unconditional continue-on-error flip for every PR.
  playwright-e2e:
    name: playwright-e2e
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright requirement
        id: pw
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$VALIDATION_BASE" ] && [ "$VALIDATION_BASE" != "0000000000000000000000000000000000000000" ]; then
            export VALIDATION_BASE
          else
            unset VALIDATION_BASE
          fi
          node scripts/validation/emit-playwright-gate.mjs >> "$GITHUB_OUTPUT"

      - name: Install Playwright Chromium
        if: steps.pw.outputs.selected == 'true'
        continue-on-error: ${{ steps.pw.outputs.enforcement != 'required' }}
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E
        id: e2e
        if: steps.pw.outputs.selected == 'true'
        continue-on-error: ${{ steps.pw.outputs.enforcement != 'required' }}
        run: npm run test:e2e:ci

      - name: Fail when required Playwright gate could not resolve
        if: steps.pw.outcome == 'failure'
        run: |
          echo "Playwright requirement resolve failed (fail-closed)."
          exit 1

      - name: Skip notice when Playwright not selected
        if: steps.pw.outcome == 'success' && steps.pw.outputs.selected != 'true'
        run: echo "Playwright not selected for this change set (SPE-3348 resolver)."

      - name: Upload Playwright report
        if: always() && steps.pw.outputs.selected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
